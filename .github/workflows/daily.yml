name: Daily Debug
on: workflow_dispatch

jobs:
  run-watchtower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Environment checks
        run: |
          pwd
          ls -la
          python -V
          python -m pip -V

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install notion-client==3.0.0
          pip install -r requirements.txt

      - name: Create config.py from secrets
        run: |
          python - << 'PYEOF'
          with open("config.py", "w") as f:
              f.write('NOTION_TOKEN = "${{ secrets.NOTION_TOKEN }}"\n')
              f.write('DATABASE_ID = "${{ secrets.DATABASE_ID }}"\n')
              f.write('TMDB_API_KEY = "${{ secrets.TMDB_API_KEY }}"\n')
              f.write('REGION = "US"\n')
              f.write('DIGEST_PAGE_TITLE = "📩 DAILY DIGEST"\n')
              f.write('SMTP_SERVER = "${{ secrets.SMTP_SERVER }}"\n')
              f.write('SMTP_PORT = ${{ secrets.SMTP_PORT }}\n')
              f.write('EMAIL_FROM = "${{ secrets.EMAIL_FROM }}"\n')
              f.write('EMAIL_PASSWORD = "${{ secrets.EMAIL_PASSWORD }}"\n')
              f.write('SMS_RECIPIENTS = "${{ secrets.SMS_RECIPIENTS }}"\n')
              f.write('SMS_SEND_MODE = "${{ secrets.SMS_SEND_MODE }}"\n')
              f.write('NOTIFICATIONS = {"new_episode_any_show": True, "bulk_season_drop": True, "season_finale": True, "episode_airing_today": True, "returning_soon": True, "long_gap": True, "multiple_episodes_tonight": True}\n')
          PYEOF

      - name: Debug notion-client
        run: |
          pip show notion-client
          python -c "
          from notion_client import Client
          c = Client(auth='test')
          print(dir(c.databases))
          "

      - name: Run Watchtower
        run: python watchtower.py