name: Daily Debug
on: workflow_dispatch

jobs:
  run-watchtower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Environment checks
        run: |
          pwd
          ls -la
          python -V
          python -m pip -V

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create config.py from secrets
        run: |
          cat > config.py << 'EOF'
          NOTION_TOKEN = "${{ secrets.NOTION_TOKEN }}"
          DATABASE_ID = "${{ secrets.DATABASE_ID }}"
          TMDB_API_KEY = "${{ secrets.TMDB_API_KEY }}"
          REGION = "US"
          DIGEST_PAGE_TITLE = "📩 DAILY DIGEST"
          SMTP_SERVER = "${{ secrets.SMTP_SERVER }}"
          SMTP_PORT = "${{ secrets.SMTP_PORT }}"
          EMAIL_FROM = "${{ secrets.EMAIL_FROM }}"
          EMAIL_PASSWORD = "${{ secrets.EMAIL_PASSWORD }}"
          SMS_RECIPIENTS = "${{ secrets.SMS_RECIPIENTS }}"
          SMS_SEND_MODE = "${{ secrets.SMS_SEND_MODE }}"
          NOTIFICATIONS = {
              "new_episode_any_show": True,
              "bulk_season_drop": True,
              "season_finale": True,
              "episode_airing_today": True,
              "returning_soon": True,
              "long_gap": True,
              "multiple_episodes_tonight": True,
          }
          EOF

      - name: Debug versions
        run: |
          python -c "import os; print('NOTION_TOKEN present:', bool(os.getenv('NOTION_TOKEN')))"
          python -c "import notion_client; print('notion-client import OK')"

      - name: Run Watchtower
        run: python watchtower.py